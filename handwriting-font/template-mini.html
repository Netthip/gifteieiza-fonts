<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แม่แบบมินิ ฟอนต์ลายมือ</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: 'Leelawadee UI', 'Cordia New', Tahoma, sans-serif; color: #333; }

  .page { width: 210mm; height: 296mm; padding: 9mm 10mm; position: relative;
          overflow: hidden; page-break-after: always; }
  .page.last { page-break-after: auto; }

  .fid { position: absolute; width: 3.5mm; height: 3.5mm; background: #000; }
  .fid.tl { top: 4mm; left: 4mm; } .fid.tr { top: 4mm; right: 4mm; }
  .fid.bl { bottom: 4mm; left: 4mm; } .fid.br { bottom: 4mm; right: 4mm; }

  .pghead { display: flex; justify-content: space-between; align-items: baseline;
            border-bottom: 0.35mm solid #9cc3e8; padding-bottom: 0.8mm; margin-bottom: 2mm; }
  .pghead h2 { font-size: 4.2mm; color: #1f4e79; }
  .pghead .sub { font-size: 2.8mm; color: #6a92b8; }
  .pgfoot { position: absolute; bottom: 4.2mm; left: 0; right: 0; text-align: center;
            font-size: 2.5mm; color: #9bb7cf; }

  .howto {
    border: 0.35mm solid #e8a4b8; background: #fff0f4; border-radius: 1.2mm;
    padding: 1.8mm 2.5mm; font-size: 2.9mm; line-height: 1.45; color: #8c3a55;
    margin-bottom: 2mm;
  }
  .howto b { color: #c0245c; }

  /* ---------- ช่องเขียนมินิ ---------- */
  :root { --tone: 6mm; --upper: 7mm; --body: 14.5mm; --desc: 5.5mm; }
  .grid { display: flex; flex-wrap: wrap; gap: 1.2mm; }
  .cell { width: 26mm; border: 0.25mm solid #b9d4ec; border-radius: 0.8mm;
          overflow: hidden; background: #fff; }
  .lbl { height: 4mm; background: #eef5fc; font-size: 2.3mm; color: #41729f;
         display: flex; align-items: center; gap: 1mm; padding: 0 1mm;
         white-space: nowrap; overflow: hidden; }
  .lbl .ch { font-size: 3.2mm; font-weight: bold; color: #1f4e79; flex-shrink: 0; }
  .wa { position: relative; height: calc(var(--tone) + var(--upper) + var(--body) + var(--desc)); }
  .band { position: absolute; left: 0; right: 0; }
  .b-tone  { top: 0; height: var(--tone); border-bottom: 0.2mm dashed #a8c8e8; }
  .b-upper { top: var(--tone); height: var(--upper); border-bottom: 0.3mm solid #7fb0dd; }
  .b-body  { top: calc(var(--tone) + var(--upper)); height: var(--body);
             border-bottom: 0.45mm solid #4a90d9; }
  .b-desc  { top: calc(var(--tone) + var(--upper) + var(--body)); height: var(--desc); }
  .hl { background: #fff3c2; }
  .band .hint { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
                text-align: center; font-size: 2.6mm; color: #c2a44a; }
  .band .hint2 { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
                 text-align: center; font-size: 2mm; color: #cccccc; }
  .ref { position: absolute; left: 0; right: 0; text-align: center;
         bottom: calc(var(--desc) + 2mm); font-size: 15.5mm; line-height: 1; color: #dcdcdc; }
  .ref.small { font-size: 9mm; bottom: calc(var(--desc) + 1.2mm); }
  .tbox { position: absolute; left: 4.5mm; right: 4.5mm;
          top: calc(var(--tone) + var(--upper)); height: var(--body);
          border: 0.35mm dashed #eda94f; border-radius: 0.6mm; }
  .tbox-mark { position: absolute; left: 50%; width: 9mm; margin-left: -4.5mm;
               border: 0.35mm dashed #eda94f; border-radius: 0.6mm; }
  .tbox-mark.up { top: calc(var(--tone) + 0.9mm); height: calc(var(--upper) - 2.1mm); }
  .tbox-mark.tn { top: 0.9mm; height: calc(var(--tone) - 2.1mm); }
  .tbox-mark.lo { top: calc(var(--tone) + var(--upper) + var(--body) + 0.7mm);
                  height: calc(var(--desc) - 1.9mm); }
</style>
</head>
<body>
<div id="gen"></div>
<script>
const CONS = [
  ["ก","ไก่"],["ข","ไข่"],["ฃ","ขวด"],["ค","ควาย"],["ฅ","คน"],["ฆ","ระฆัง"],["ง","งู"],
  ["จ","จาน"],["ฉ","ฉิ่ง"],["ช","ช้าง"],["ซ","โซ่"],["ฌ","เฌอ"],["ญ","หญิง"],["ฎ","ชฎา"],
  ["ฏ","ปฏัก"],["ฐ","ฐาน"],["ฑ","มณโฑ"],["ฒ","ผู้เฒ่า"],["ณ","เณร"],["ด","เด็ก"],
  ["ต","เต่า"],["ถ","ถุง"],["ท","ทหาร"],["ธ","ธง"],["น","หนู"],["บ","ใบไม้"],["ป","ปลา"],
  ["ผ","ผึ้ง"],["ฝ","ฝา"],["พ","พาน"],["ฟ","ฟัน"],["ภ","สำเภา"],["ม","ม้า"],["ย","ยักษ์"],
  ["ร","เรือ"],["ล","ลิง"],["ว","แหวน"],["ศ","ศาลา"],["ษ","ฤๅษี"],["ส","เสือ"],
  ["ห","หีบ"],["ฬ","จุฬา"],["อ","อ่าง"],["ฮ","นกฮูก"]
];
const EXTRA = [["ฤ","ตัว ฤ"],["ฦ","ตัว ฦ"],["ๅ","ลากข้าง"],["ฯ","ไปยาล"],["ๆ","ไม้ยมก"],["฿","บาท"]];
const BASEV = [["ะ","สระอะ"],["า","สระอา"],["ำ","สระอำ"],["เ","สระเอ"],["แ","สระแอ"],
  ["โ","สระโอ"],["ใ","ไม้ม้วน"],["ไ","ไม้มลาย"]];
const UPPERV = [["ั","ไม้หัน"],["ิ","สระอิ"],["ี","สระอี"],["ึ","สระอึ"],["ื","สระอือ"],
  ["็","ไต่คู้"],["ํ","นิคหิต"]];
const LOWERV = [["ุ","สระอุ"],["ู","สระอู"]];
const TONE1 = [["่","เอก·ปกติ"],["้","โท·ปกติ"],["๊","ตรี·ปกติ"],["๋","จัตวา·ปกติ"],["์","การันต์·ปกติ"]];
const TONE2 = [["่","เอก·สูง"],["้","โท·สูง"],["๊","ตรี·สูง"],["๋","จัตวา·สูง"],["์","การันต์·สูง"]];
const TDIG = "๐๑๒๓๔๕๖๗๘๙".split("").map((d,i)=>[d,"เลขไทย "+i]);
const ADIG = "0123456789".split("").map(d=>[d,"เลข "+d]);
const PUNCT = [[".","จุด"],[",","จุลภาค"],["!","อัศเจรีย์"],["?","ปรัศนี"],["\"","อัญประกาศ"],
  ["'","อะพอส."],["(","วงเล็บเปิด"],[")","วงเล็บปิด"],["[","เหลี่ยมเปิด"],["]","เหลี่ยมปิด"],
  ["-","ยัติภังค์"],["_","ขีดล่าง"],[":","ทวิภาค"],[";","อัฒภาค"],["/","ทับ"],
  ["\\","ทับกลับ"],["@","แอต"],["#","แฮช"],["%","เปอร์เซ็นต์"],["&","แอนด์"]];
const UPLAT = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(c=>[c,"ใหญ่"]);
const LOLAT = "abcdefghijklmnopqrstuvwxyz".split("").map(c=>[c,"เล็ก"]);
const DOT = "◌";

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function cell(ch, name, type){
  const isMark = ["upper","tone1","tone2","lower"].includes(type);
  const shown = isMark ? DOT + ch : ch;
  let lbl = '<div class="lbl"><span class="ch">' + esc(shown) + '</span><span>' + esc(name) + '</span></div>';
  let tone = '<div class="band b-tone"></div>', upper = '<div class="band b-upper"></div>';
  let body = '<div class="band b-body"></div>', desc = '<div class="band b-desc"></div>';
  let ref = "";
  if (type === "base") ref = '<div class="ref">' + esc(ch) + '</div><div class="tbox"></div>';
  else if (type === "small") ref = '<div class="ref small">' + esc(ch) + '</div>';
  else if (type === "upper" || type === "tone1") {
    upper = '<div class="band b-upper hl"><div class="hint">' + esc(DOT+ch) + '</div></div>';
    ref = '<div class="tbox-mark up"></div>';
  } else if (type === "tone2") {
    tone = '<div class="band b-tone hl"><div class="hint">' + esc(DOT+ch) + '</div></div>';
    upper = '<div class="band b-upper"><div class="hint2">(ที่สระบน—เว้น)</div></div>';
    ref = '<div class="tbox-mark tn"></div>';
  } else if (type === "lower") {
    desc = '<div class="band b-desc hl"><div class="hint">' + esc(DOT+ch) + '</div></div>';
    ref = '<div class="tbox-mark lo"></div>';
  } else if (type === "spare") {
    lbl = '<div class="lbl"><span class="ch">✎</span><span>สำรอง</span></div>';
    body = '<div class="band b-body"><div class="hint2">เขียนตัวที่พลาด</div></div>';
  }
  return '<div class="cell">' + lbl + '<div class="wa">' + tone + upper + body + desc + ref + '</div></div>';
}

const mk = (arr, type) => arr.map(x => cell(x[0], x[1], type)).join("");
const spares = n => Array.from({length: n}, () => cell("", "", "spare")).join("");

const HOWTO =
  '<div class="howto"><b>แม่แบบมินิ — เขียนแค่หน้า 1–2 ก็ได้ฟอนต์ไทยครบ!</b> (หน้า 3–4 เลข/อังกฤษ/เครื่องหมาย เขียนเมื่ออยากได้) · ' +
  'เขียนตัวเล็กได้เลย ให้<b>เต็มกรอบประส้มพอดี</b> · ปากกาดำ 0.5–0.7 มม. · ' +
  'ช่อง<b>แถบเหลือง</b>เขียนเฉพาะเครื่องหมายนั้นในกรอบ · วรรณยุกต์ 2 ชุดเหมือนเดิม (ปกติ = บนพยัญชนะตรงๆ / สูง = ตอนมีสระบน เช่น กิ๊) · ' +
  'หาง ป ฝ ฟ ฬ ยื่นขึ้น, ฎ ฏ ยื่นลงนอกกรอบได้ · เขียนพลาดใช้ช่องสำรอง · ' +
  'อย่าโดนสี่เหลี่ยมดำ · ปริ้น <b>100%</b> · สแกน <b>300–600 dpi</b> แล้วส่งไฟล์มาได้เลย</div>';

function page(num, total, title, sub, inner, last){
  return '<div class="page' + (last ? ' last' : '') + '">' +
    '<div class="fid tl"></div><div class="fid tr"></div><div class="fid bl"></div><div class="fid br"></div>' +
    '<div class="pghead"><h2>' + title + '</h2><div class="sub">' + sub + '</div></div>' +
    inner +
    '<div class="pgfoot">ฟอนต์ลายมือกิฟ · แม่แบบมินิ — หน้า ' + num + '/' + total + '</div></div>';
}

const pages = [];
pages.push(page(1, 4, "มินิ ๑ — พยัญชนะ", "ก – ฬ · เต็มกรอบประพอดี",
  HOWTO + '<div class="grid">' + mk(CONS.slice(0, 42), "base") + '</div>'));
pages.push(page(2, 4, "มินิ ๒ — พยัญชนะที่เหลือ สระ วรรณยุกต์ เลขไทย (จบไทยครบในหน้านี้!)",
  "แถบเหลือง = เขียนเครื่องหมายในกรอบเท่านั้น",
  '<div class="grid">' + mk(CONS.slice(42), "base") + mk(EXTRA, "base") + mk(BASEV, "base") +
  mk(UPPERV, "upper") + mk(LOWERV, "lower") + mk(TONE1, "tone1") + mk(TONE2, "tone2") +
  mk(TDIG, "base") + spares(4) + '</div>'));
pages.push(page(3, 4, "เสริม ๑ — เลขอารบิก เครื่องหมาย A–S", "เขียนเมื่ออยากให้ฟอนต์พิมพ์อังกฤษ/เลขได้",
  '<div class="grid">' + mk(ADIG, "base") + mk(PUNCT, "small") + mk(UPLAT.slice(0, 19), "base") + '</div>'));
pages.push(page(4, 4, "เสริม ๒ — T–Z และ a–z", "ตัวเล็กสูงราวครึ่งกรอบ · หาง g j p q y ลงล่าง",
  '<div class="grid">' + mk(UPLAT.slice(19), "base") + mk(LOLAT, "base") + spares(3) + '</div>', true));

document.getElementById("gen").innerHTML = pages.join("");
</script>
</body>
</html>
